<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карточка материала — QOR</title><link rel="stylesheet" href="/style.css?v=20261118d"></head><body><main><p><a href="/">← Вернуться в QOR</a></p><div class="eyebrow">QOR / КАРТОЧКА</div><h1>Карточка материала</h1><article class="result" id="item">Загрузка…</article></main><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function safeUrl(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}}
(async()=>{const id=new URLSearchParams(location.search).get('id'),el=document.querySelector('#item');if(!/^\d+$/.test(id||'')){el.textContent='Некорректный идентификатор';return;}try{const r=await fetch('/api/items/'+id);if(!r.ok)throw Error('Запись не найдена');const d=await r.json(),fields=[['Автор',d.authors],['Год',d.year],['Издательство',d.publisher],['Язык',d.language],['Тип',d.kind],['Описание',d.description],['ISBN',d.isbn],['УДК',d.udc],['Предполагаемый ББК (проверить)',d.bbk_candidate],['Наличие',({available:'доступно',unavailable:'недоступно',on_request:'по запросу'})[d.availability]||'неизвестно'],['Местонахождение',d.location]],u=safeUrl(d.url);let action=d.pdf_available?'<a class="pdf-link" target="_blank" rel="noopener" href="/api/items/'+encodeURIComponent(d.id)+'/pdf">Открыть PDF ↗</a>':u?'<a class="pdf-link" target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">Открыть электронный ресурс ↗</a>':'<span class="muted">Электронный текст не прикреплён.</span>';const q=encodeURIComponent([d.title,d.authors].filter(Boolean).join(' '));el.innerHTML='<h2>'+esc(d.title)+'</h2><div class="card-actions">'+action+'<a class="outline" target="_blank" rel="noopener noreferrer" href="https://scholar.google.com/scholar?q='+q+'">Найти в Google Scholar ↗</a><a class="outline" target="_blank" rel="noopener noreferrer" href="https://books.google.com/books?q='+q+'">Найти в Google Books ↗</a></div><p>Поиск на внешних сайтах не гарантирует, что полный текст или PDF доступны.</p>'+fields.map(([k,v])=>'<p><b>'+esc(k)+':</b> '+esc(v||'не указано')+'</p>').join('');}catch(e){el.textContent=e.message;}})();
</script></body></html>
